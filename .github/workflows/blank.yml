          static int b_sem_destroy(uint32_t *slot) { sem_t *s = (sem_t *)(uintptr_t)*slot; if (s) { sem_destroy(s); free(s); } *slot = 0; return 0; }
          static int b_sem_wait(uint32_t *slot) { return sem_wait((sem_t *)(uintptr_t)*slot); }
