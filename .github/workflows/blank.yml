name: build-armhf
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang toolchain ARM 32-bit
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Tulis sumber
        run: |
          mkdir -p src out/luxor_android/libs
          cat > src/elfprobe.c <<'EOF_C1'
          /* elfprobe - Milestone 1 port Luxor Android (armhf, muOS).
           * HANYA MEMBACA: mem-parse libmain.so + libfmodex.so (ELF32 ARM), lalu cek tiap simbol impor
           * terhadap library 32-bit milik device (glibc, Mali GLES/EGL, gl4es). Tidak menjalankan kode game. */
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <elf.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/utsname.h>
          #include <gnu/libc-version.h>

          #define MAXN 2048

          typedef struct {
            const uint8_t *map; size_t size;
            const Elf32_Ehdr *eh; const Elf32_Shdr *sh;
            const Elf32_Sym *sym; int nsym; const char *str;
            const Elf32_Dyn *dyn; int ndyn;
          } Lib;

          static FILE *rep;

          static void P(const char *fmt, ...) {
            va_list ap;
            va_start(ap, fmt); vprintf(fmt, ap); va_end(ap);
            if (rep) { va_start(ap, fmt); vfprintf(rep, fmt, ap); va_end(ap); }
          }

          static int load_lib(const char *path, Lib *L) {
            struct stat st;
            int fd, i;
            memset(L, 0, sizeof *L);
            fd = open(path, O_RDONLY);
            if (fd < 0) { P("GAGAL membuka %s\n", path); return -1; }
            if (fstat(fd, &st) != 0) { close(fd); return -1; }
            L->size = (size_t)st.st_size;
            L->map = mmap(NULL, L->size, PROT_READ, MAP_PRIVATE, fd, 0);
            close(fd);
            if (L->map == MAP_FAILED) { P("GAGAL mmap %s\n", path); return -1; }
            if (L->size < sizeof(Elf32_Ehdr) || memcmp(L->map, ELFMAG, SELFMAG) != 0) { P("%s bukan file ELF\n", path); return -1; }
            L->eh = (const Elf32_Ehdr *)L->map;
            if (L->eh->e_ident[EI_CLASS] != ELFCLASS32 || L->eh->e_machine != EM_ARM) {
              P("%s bukan ELF ARM 32-bit (class=%d machine=%d)\n", path, L->eh->e_ident[EI_CLASS], L->eh->e_machine);
              return -1;
            }
            if (L->eh->e_shoff == 0 || L->eh->e_shentsize != sizeof(Elf32_Shdr) ||
                (size_t)L->eh->e_shoff + (size_t)L->eh->e_shnum * sizeof(Elf32_Shdr) > L->size) {
              P("%s: section header tidak ada/rusak\n", path); return -1;
            }
            L->sh = (const Elf32_Shdr *)(L->map + L->eh->e_shoff);
            for (i = 0; i < L->eh->e_shnum; i++) {
              const Elf32_Shdr *s = &L->sh[i];
              if ((size_t)s->sh_offset + s->sh_size > L->size) continue;
              if (s->sh_type == SHT_DYNSYM) {
                L->sym = (const Elf32_Sym *)(L->map + s->sh_offset);
                L->nsym = (int)(s->sh_size / sizeof(Elf32_Sym));
                if (s->sh_link < L->eh->e_shnum) L->str = (const char *)(L->map + L->sh[s->sh_link].sh_offset);
              } else if (s->sh_type == SHT_DYNAMIC) {
                L->dyn = (const Elf32_Dyn *)(L->map + s->sh_offset);
                L->ndyn = (int)(s->sh_size / sizeof(Elf32_Dyn));
              }
            }
            if (!L->sym || !L->str) { P("%s: .dynsym tidak ditemukan\n", path); return -1; }
            return 0;
          }

          static void print_needed(const Lib *L) {
            int i;
            for (i = 0; i < L->ndyn; i++) {
              if (L->dyn[i].d_tag == DT_NEEDED) P("  NEEDED %s\n", L->str + L->dyn[i].d_un.d_val);
              else if (L->dyn[i].d_tag == DT_SONAME) P("  SONAME %s\n", L->str + L->dyn[i].d_un.d_val);
            }
          }

          static int has_export(const Lib *L, const char *name) {
            int i;
            for (i = 1; i < L->nsym; i++) {
              const Elf32_Sym *s = &L->sym[i];
              if (s->st_shndx != SHN_UNDEF && s->st_name && strcmp(L->str + s->st_name, name) == 0) return 1;
            }
            return 0;
          }

          /* simbol yang ada di glibc tapi layout/ABI-nya BEDA dari bionic (Android) -> perlu pembungkus */
          static int abi_risky(const char *n) {
            static const char *pfx[] = { "pthread_", "sem_", "stat", "fstat", "lstat", "readdir", "scandir",
              "opendir", "closedir", "setjmp", "longjmp", "_setjmp", "_longjmp", "sigsetjmp", "siglongjmp",
              "sigaction", "signal", "sigprocmask", "dlopen", "dlsym", "dlclose", "dlerror", NULL };
            int i;
            for (i = 0; pfx[i]; i++) if (strncmp(n, pfx[i], strlen(pfx[i])) == 0) return 1;
            return 0;
          }

          static void *try_open(const char *p) {
            void *h = dlopen(p, RTLD_LAZY | RTLD_LOCAL);
            P("  dlopen %-36s : %s\n", p, h ? "OK" : dlerror());
            return h;
          }

          typedef struct { const char *name[MAXN]; int n; } List;
          static void add(List *l, const char *s) { if (l->n < MAXN) l->name[l->n++] = s; }
          static void dump(const char *title, const List *l) {
            int i;
            P("\n-- %s (%d)\n", title, l->n);
            for (i = 0; i < l->n; i++) P("  %s\n", l->name[i]);
          }

          static void classify(const Lib *L, const Lib *fm, const char *label, void *h_gles, void *h_mali, void *h_gl4es) {
            List fmod = {{0}, 0}, ok = {{0}, 0}, risky = {{0}, 0}, gl = {{0}, 0}, miss = {{0}, 0};
            int i, nimp = 0;
            P("\n=== %s: klasifikasi simbol impor ===\n", label);
            for (i = 1; i < L->nsym; i++) {
              const Elf32_Sym *s = &L->sym[i];
              const char *n;
              if (s->st_shndx != SHN_UNDEF || !s->st_name) continue;
              n = L->str + s->st_name;
              nimp++;
              if (fm && has_export(fm, n)) { add(&fmod, n); continue; }
              if (dlsym(RTLD_DEFAULT, n)) { if (abi_risky(n)) add(&risky, n); else add(&ok, n); continue; }
              if ((h_gles && dlsym(h_gles, n)) || (h_mali && dlsym(h_mali, n)) || (h_gl4es && dlsym(h_gl4es, n))) { add(&gl, n); continue; }
              add(&miss, n);
            }
            P("total impor=%d | dari libfmodex=%d | ada di glibc (aman)=%d | ada di glibc tapi ABI beda=%d | ada di GL device=%d | TIDAK ADA=%d\n",
              nimp, fmod.n, ok.n, risky.n, gl.n, miss.n);
            dump("ABI-RISK: ada di glibc tapi perlu pembungkus", &risky);
            dump("TIDAK ADA: perlu shim/implementasi sendiri", &miss);
          }

          static void gl_report(const Lib *L, void *h_gles, void *h_mali, void *h_gl4es) {
            int i, total = 0, okm = 0;
            P("\n=== fungsi GL/EGL yang dipakai libmain.so ===\n");
            P("  huruf: C=libGLESv1_CM  M=libmali  G=gl4es  (-=tidak ada)\n");
            for (i = 1; i < L->nsym; i++) {
              const Elf32_Sym *s = &L->sym[i];
              const char *n;
              int c, m, g;
              if (s->st_shndx != SHN_UNDEF || !s->st_name) continue;
              n = L->str + s->st_name;
              if (strncmp(n, "gl", 2) != 0 && strncmp(n, "egl", 3) != 0) continue;
              c = h_gles && dlsym(h_gles, n); m = h_mali && dlsym(h_mali, n); g = h_gl4es && dlsym(h_gl4es, n);
              total++; if (c || m) okm++;
              P("  %c%c%c %s\n", c ? 'C' : '-', m ? 'M' : '-', g ? 'G' : '-', n);
            }
            P("ringkas: %d fungsi GL/EGL dipakai, %d tersedia langsung di libGLESv1_CM/libmali\n", total, okm);
          }

          int main(int argc, char **argv) {
            Lib main_lib, fm_lib;
            struct utsname u;
            void *h_gles, *h_mali, *h_gl4es, *h_egl;
            int i, njni = 0;

            if (argc < 3) { fprintf(stderr, "pakai: %s libmain.so libfmodex.so [report.txt]\n", argv[0]); return 2; }
            if (argc > 3) rep = fopen(argv[3], "w");

            P("== elfprobe (Luxor Android, Milestone 1) ==\n");
            if (uname(&u) == 0) P("device: %s %s %s\n", u.sysname, u.release, u.machine);
            P("glibc: %s\n", gnu_get_libc_version());

            /* muat runtime umum supaya dlsym(RTLD_DEFAULT) mewakili apa yang tersedia untuk game */
            dlopen("libm.so.6", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libgcc_s.so.1", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libstdc++.so.6", RTLD_NOW | RTLD_GLOBAL);

            P("\n== library grafik 32-bit di device ==\n");
            h_gles = try_open("/usr/lib32/libGLESv1_CM.so.1");
            h_mali = try_open("/usr/lib32/libmali.so");
            h_egl  = try_open("/usr/lib32/libEGL.so.1");
            h_gl4es = try_open("/usr/lib32/gl4es/libGL.so.1");
            if (h_egl) P("  eglGetProcAddress: %s | eglGetDisplay: %s\n",
                         dlsym(h_egl, "eglGetProcAddress") ? "ada" : "TIDAK", dlsym(h_egl, "eglGetDisplay") ? "ada" : "TIDAK");

            P("\n== libmain.so ==\n");
            if (load_lib(argv[1], &main_lib) != 0) return 1;
            print_needed(&main_lib);
            for (i = 1; i < main_lib.nsym; i++) {
              const Elf32_Sym *s = &main_lib.sym[i];
              const char *n;
              if (s->st_shndx == SHN_UNDEF || !s->st_name) continue;
              n = main_lib.str + s->st_name;
              if (strncmp(n, "Java_", 5) == 0 || strcmp(n, "JNI_OnLoad") == 0) njni++;
            }
            P("  titik masuk JNI terekspor: %d (termasuk JNI_OnLoad jika ada)\n", njni);

            P("\n== libfmodex.so ==\n");
            if (load_lib(argv[2], &fm_lib) != 0) return 1;
            print_needed(&fm_lib);
            P("  simbol terekspor: %d\n", fm_lib.nsym - 1);

            classify(&main_lib, &fm_lib, "libmain.so", h_gles, h_mali, h_gl4es);
            classify(&fm_lib, NULL, "libfmodex.so", h_gles, h_mali, h_gl4es);
            gl_report(&main_lib, h_gles, h_mali, h_gl4es);

            P("\n== selesai ==\n");
            if (rep) fclose(rep);
            return 0;
          }
          EOF_C1
          cat > src/luxorloader.c <<'EOF_C2'
          /* luxorloader - Milestone 2 port Luxor Android (armhf / muOS).
           * Memuat libfmodex.so + libmain.so (ELF32 ARM, bionic) SENDIRI tanpa dlopen,
           * memetakan impornya ke shim bionic->glibc, menyediakan JNI palsu, lalu memanggil JNI_OnLoad.
           * Target tahap ini: JNI_OnLoad selesai tanpa crash + log semua panggilan JNI.
           * Pakai: luxorloader <folder-libs> [--dry]   (--dry = muat & relokasi saja, tanpa menjalankan kode game) */
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <setjmp.h>
          #include <errno.h>
          #include <elf.h>
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <signal.h>
          #include <ucontext.h>
          #include <pthread.h>
          #include <semaphore.h>
          #include <dirent.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/utsname.h>
          #include <gnu/libc-version.h>

          #pragma GCC diagnostic ignored "-Wdeprecated-declarations"
          #define PAGE 4096u
          #define MAXMOD 4
          #define MAXUNRES 64
          #define U32(p) ((uint32_t)(uintptr_t)(p))

          static FILE *logf;

          static void L(const char *fmt, ...) {
            va_list ap;
            va_start(ap, fmt); vfprintf(stdout, fmt, ap); va_end(ap); fflush(stdout);
            if (logf) { va_start(ap, fmt); vfprintf(logf, fmt, ap); va_end(ap); fflush(logf); }
          }

          /* ======================= modul ELF ======================= */
          typedef struct {
            char name[64];
            uint8_t *file; size_t fsize;
            uint8_t *base; size_t span; uintptr_t bias;
            Elf32_Sym *sym; int nsym; const char *str;
            Elf32_Rel *rel; uint32_t nrel; Elf32_Rel *jrel; uint32_t njrel;
            uint32_t init; uint32_t *iarr; uint32_t niarr;
          } Mod;

          static Mod mods[MAXMOD];
          static int nmods;

          static const char *unres_name[MAXUNRES];
          static int nunres;
          static const char *shim_hit[256];
          static int nshim_hit;
          static int cnt_self, cnt_mod, cnt_shim, cnt_libc, cnt_gl, cnt_unres, cnt_weak0;
          static void *h_gles, *h_egl;

          static int trap_unres(int i);
          static int jni_trap(int i);
          #include "stubs.inc"

          static int trap_unres(int i) {
            L("\n*** PANGGILAN KE SIMBOL TAK TERSELESAIKAN: %s ***\n", (i >= 0 && i < nunres) ? unres_name[i] : "?");
            _exit(3);
            return 0;
          }

          static void describe(uintptr_t a) {
            int i;
            for (i = 0; i < nmods; i++)
              if (a >= (uintptr_t)mods[i].base && a < (uintptr_t)mods[i].base + mods[i].span)
                L("    -> %s + 0x%x\n", mods[i].name, (unsigned)(a - mods[i].bias));
          }

          static void on_sig(int sig, siginfo_t *si, void *ctx) {
            ucontext_t *uc = (ucontext_t *)ctx;
            uintptr_t pc = 0, lr = 0;
          #if defined(__arm__)
            pc = uc->uc_mcontext.arm_pc; lr = uc->uc_mcontext.arm_lr;
          #elif defined(__x86_64__)
            pc = (uintptr_t)uc->uc_mcontext.gregs[REG_RIP];
          #endif
            L("\n*** SINYAL %d  addr=%p  pc=%p  lr=%p ***\n", sig, si->si_addr, (void *)pc, (void *)lr);
            describe(pc); describe(lr);
            _exit(128 + sig);
          }

          /* ======================= shim bionic -> glibc ======================= */
          /* --- ctype / stdio bionic --- */
          static char bionic_ctype[1 + 256];
          static int16_t bionic_tolower[1 + 256], bionic_toupper[1 + 256];
          static char bionic_sF[3 * 84];

          static void init_tables(void) {
            int c;
            bionic_ctype[0] = 0; bionic_tolower[0] = -1; bionic_toupper[0] = -1;
            for (c = 0; c < 256; c++) {
              unsigned f = 0;
              if (c < 128) {
                if (c >= 'A' && c <= 'Z') f |= 0x01;
                if (c >= 'a' && c <= 'z') f |= 0x02;
                if (c >= '0' && c <= '9') f |= 0x04;
                if (c == ' ' || (c >= 9 && c <= 13)) f |= 0x08;
                if ((c > 32 && c < 127) && !((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z') || (c >= '0' && c <= '9'))) f |= 0x10;
                if (c < 32 || c == 127) f |= 0x20;
                if ((c >= '0' && c <= '9') || (c >= 'A' && c <= 'F') || (c >= 'a' && c <= 'f')) f |= 0x40;
                if (c == ' ') f |= 0x80;
              }
              bionic_ctype[1 + c] = (char)f;
              bionic_tolower[1 + c] = (int16_t)((c >= 'A' && c <= 'Z') ? c + 32 : c);
              bionic_toupper[1 + c] = (int16_t)((c >= 'a' && c <= 'z') ? c - 32 : c);
            }
          }

          static FILE *xf(FILE *f) {
            uintptr_t a = (uintptr_t)f, b = (uintptr_t)bionic_sF;
            if (a >= b && a < b + sizeof bionic_sF) { unsigned i = (unsigned)((a - b) / 84); return i == 0 ? stdin : i == 1 ? stdout : stderr; }
            return f;
          }
          static int b_fprintf(FILE *f, const char *fmt, ...) { va_list ap; int r; va_start(ap, fmt); r = vfprintf(xf(f), fmt, ap); va_end(ap); return r; }
          static int b_vfprintf(FILE *f, const char *fmt, va_list ap) { return vfprintf(xf(f), fmt, ap); }
          static int b_fputs(const char *s, FILE *f) { return fputs(s, xf(f)); }
          static int b_fputc(int c, FILE *f) { return fputc(c, xf(f)); }
          static size_t b_fwrite(const void *p, size_t s, size_t n, FILE *f) { return fwrite(p, s, n, xf(f)); }
          static size_t b_fread(void *p, size_t s, size_t n, FILE *f) { return fread(p, s, n, xf(f)); }
          static int b_fflush(FILE *f) { return fflush(xf(f)); }
          static char *b_fgets(char *s, int n, FILE *f) { return fgets(s, n, xf(f)); }
          static int b_fgetc(FILE *f) { return fgetc(xf(f)); }
          static int b_srget(FILE *f) { return fgetc(xf(f)); }
          static int b_swbuf(int c, FILE *f) { return fputc(c, xf(f)); }

          /* --- log / assert / misc bionic --- */
          static int *b_errno(void) { return &errno; }
          static int b_android_log_print(int prio, const char *tag, const char *fmt, ...) {
            char buf[1024]; va_list ap;
            va_start(ap, fmt); vsnprintf(buf, sizeof buf, fmt ? fmt : "", ap); va_end(ap);
            L("[droid %d/%s] %s\n", prio, tag ? tag : "?", buf);
            return 1;
          }
          static int b_android_log_write(int prio, const char *tag, const char *text) {
            L("[droid %d/%s] %s\n", prio, tag ? tag : "?", text ? text : "");
            return 1;
          }
          static void b_assert2(const char *file, int line, const char *func, const char *msg) {
            L("\n*** ASSERT bionic: %s:%d (%s): %s ***\n", file, line, func, msg);
            abort();
          }
          static int b_aeabi_atexit(void *obj, void (*dtor)(void *), void *dso) {
            extern int __cxa_atexit(void (*)(void *), void *, void *);
            return __cxa_atexit(dtor, obj, dso);
          }
          static void *b_register_frame_info(const void *a, void *b) { (void)a; (void)b; return NULL; }
          static void *b_deregister_frame_info(const void *a) { (void)a; return NULL; }
          static void b_jv_register(void *a) { (void)a; }
          static uint32_t b_stack_chk_guard = 0x00a4c3e1u;

          /* --- stat (layout stat bionic ARM32 = stat64 kernel) --- */
          static int b_stat(const char *p, void *b) { return stat64(p, (struct stat64 *)b); }
          static int b_fstat(int fd, void *b) { return fstat64(fd, (struct stat64 *)b); }
          static int b_lstat(const char *p, void *b) { return lstat64(p, (struct stat64 *)b); }

          /* --- pthread: objek bionic cuma 4 byte -> simpan pointer ke objek glibc asli (lazy) --- */
          static pthread_mutex_t g_initlock = PTHREAD_MUTEX_INITIALIZER;

          static pthread_mutex_t *mx_get(uint32_t *slot) {
            uint32_t v = __atomic_load_n(slot, __ATOMIC_ACQUIRE);
            if (v > 0xFFFFu) return (pthread_mutex_t *)(uintptr_t)v;
            pthread_mutex_lock(&g_initlock);
            v = *slot;
            if (v <= 0xFFFFu) {
              pthread_mutex_t *m = calloc(1, sizeof *m);
              pthread_mutexattr_t a;
              pthread_mutexattr_init(&a);
              if (v & 0x4000) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_RECURSIVE);
              else if (v & 0x8000) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_ERRORCHECK);
              pthread_mutex_init(m, &a); pthread_mutexattr_destroy(&a);
              v = U32(m);
              __atomic_store_n(slot, v, __ATOMIC_RELEASE);
            }
            pthread_mutex_unlock(&g_initlock);
            return (pthread_mutex_t *)(uintptr_t)v;
          }
          static int b_mutex_init(uint32_t *slot, const long *attr) {
            pthread_mutex_t *m = calloc(1, sizeof *m);
            pthread_mutexattr_t a;
            pthread_mutexattr_init(&a);
            if (attr && *attr == 1) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_RECURSIVE);
            else if (attr && *attr == 2) pthread_mutexattr_settype(&a, PTHREAD_MUTEX_ERRORCHECK);
            pthread_mutex_init(m, &a); pthread_mutexattr_destroy(&a);
            *slot = U32(m);
            return 0;
          }
          static int b_mutex_destroy(uint32_t *slot) {
            if (*slot > 0xFFFFu) { pthread_mutex_t *m = (pthread_mutex_t *)(uintptr_t)*slot; pthread_mutex_destroy(m); free(m); }
            *slot = 0;
            return 0;
          }
          static int b_mutex_lock(uint32_t *s) { return pthread_mutex_lock(mx_get(s)); }
          static int b_mutex_unlock(uint32_t *s) { return pthread_mutex_unlock(mx_get(s)); }
          static int b_mutex_trylock(uint32_t *s) { return pthread_mutex_trylock(mx_get(s)); }
          static int b_mutexattr_init(long *a) { *a = 0; return 0; }
          static int b_mutexattr_settype(long *a, int t) { *a = t; return 0; }
          static int b_mutexattr_gettype(const long *a, int *t) { *t = (int)*a; return 0; }
          static int b_mutexattr_destroy(long *a) { (void)a; return 0; }

          static pthread_cond_t *cv_get(uint32_t *slot) {
            uint32_t v = __atomic_load_n(slot, __ATOMIC_ACQUIRE);
            if (v > 0xFFFFu) return (pthread_cond_t *)(uintptr_t)v;
            pthread_mutex_lock(&g_initlock);
            v = *slot;
            if (v <= 0xFFFFu) {
              pthread_cond_t *c = calloc(1, sizeof *c);
              pthread_cond_init(c, NULL);
              v = U32(c);
              __atomic_store_n(slot, v, __ATOMIC_RELEASE);
            }
            pthread_mutex_unlock(&g_initlock);
            return (pthread_cond_t *)(uintptr_t)v;
          }
          static int b_cond_init(uint32_t *slot, const void *attr) { pthread_cond_t *c = calloc(1, sizeof *c); (void)attr; pthread_cond_init(c, NULL); *slot = U32(c); return 0; }
          static int b_cond_destroy(uint32_t *slot) { if (*slot > 0xFFFFu) { pthread_cond_t *c = (pthread_cond_t *)(uintptr_t)*slot; pthread_cond_destroy(c); free(c); } *slot = 0; return 0; }
