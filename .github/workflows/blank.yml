          /* ======================= pemuat ELF ======================= */
          static int read_file(const char *path, uint8_t **buf, size_t *len) {
            FILE *f = fopen(path, "rb");
            long n;
            if (!f) return -1;
            fseek(f, 0, SEEK_END); n = ftell(f); fseek(f, 0, SEEK_SET);
            *buf = malloc((size_t)n);
            if (!*buf || fread(*buf, 1, (size_t)n, f) != (size_t)n) { fclose(f); return -1; }
            fclose(f); *len = (size_t)n;
            return 0;
          }

          static int load_mod(const char *dir, const char *name, Mod **out) {
            char path[512];
            Mod *m;
            const Elf32_Ehdr *eh;
            const Elf32_Phdr *ph;
            uint32_t minv = 0xFFFFFFFFu, maxv = 0;
            int i, dyn_found = 0;
            if (nmods >= MAXMOD) return -1;
            m = &mods[nmods];
            memset(m, 0, sizeof *m);
            snprintf(m->name, sizeof m->name, "%s", name);
            snprintf(path, sizeof path, "%s/%s", dir, name);
            if (read_file(path, &m->file, &m->fsize) != 0) { L("GAGAL membaca %s\n", path); return -1; }
            eh = (const Elf32_Ehdr *)m->file;
            if (m->fsize < sizeof *eh || memcmp(eh->e_ident, ELFMAG, SELFMAG) || eh->e_ident[EI_CLASS] != ELFCLASS32 || eh->e_machine != EM_ARM || eh->e_type != ET_DYN) {
              L("%s: bukan ELF ARM32 shared object\n", name); return -1;
            }
            ph = (const Elf32_Phdr *)(m->file + eh->e_phoff);
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              if (ph[i].p_vaddr < minv) minv = ph[i].p_vaddr;
              if (ph[i].p_vaddr + ph[i].p_memsz > maxv) maxv = ph[i].p_vaddr + ph[i].p_memsz;
            }
            minv &= ~(PAGE - 1); maxv = (maxv + PAGE - 1) & ~(PAGE - 1);
            m->span = maxv - minv;
            {
              int fl = MAP_PRIVATE | MAP_ANONYMOUS;
          #if defined(__x86_64__) && defined(MAP_32BIT)
              fl |= MAP_32BIT;
          #endif
              m->base = mmap(NULL, m->span, PROT_READ | PROT_WRITE, fl, -1, 0);
            }
            if (m->base == MAP_FAILED) { L("%s: mmap gagal\n", name); return -1; }
            m->bias = (uintptr_t)m->base - minv;
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              if ((size_t)ph[i].p_offset + ph[i].p_filesz > m->fsize) { L("%s: segmen melewati ujung file\n", name); return -1; }
              memcpy((void *)(m->bias + ph[i].p_vaddr), m->file + ph[i].p_offset, ph[i].p_filesz);
            }
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_DYNAMIC) {
              const Elf32_Dyn *d = (const Elf32_Dyn *)(m->bias + ph[i].p_vaddr);
              dyn_found = 1;
              for (; d->d_tag != DT_NULL; d++) {
                switch (d->d_tag) {
                  case DT_SYMTAB: m->sym = (Elf32_Sym *)(m->bias + d->d_un.d_ptr); break;
                  case DT_STRTAB: m->str = (const char *)(m->bias + d->d_un.d_ptr); break;
                  case DT_REL: m->rel = (Elf32_Rel *)(m->bias + d->d_un.d_ptr); break;
                  case DT_RELSZ: m->nrel = d->d_un.d_val / sizeof(Elf32_Rel); break;
                  case DT_JMPREL: m->jrel = (Elf32_Rel *)(m->bias + d->d_un.d_ptr); break;
                  case DT_PLTRELSZ: m->njrel = d->d_un.d_val / sizeof(Elf32_Rel); break;
                  case DT_INIT: m->init = d->d_un.d_val; break;
                  case DT_INIT_ARRAY: m->iarr = (uint32_t *)(m->bias + d->d_un.d_ptr); break;
                  case DT_INIT_ARRAYSZ: m->niarr = d->d_un.d_val / 4; break;
                  case DT_RELA: case 0x6000000f: case 0x60000011: case DT_RELR:
                    L("%s: tipe relokasi tidak didukung (tag 0x%x)\n", name, (unsigned)d->d_tag); return -1;
                  case DT_NEEDED: break;
                  default: break;
                }
              }
            }
            if (!dyn_found || !m->sym || !m->str) { L("%s: section dinamis tidak lengkap\n", name); return -1; }
            /* jumlah simbol dinamis: dari section header (.dynsym) */
            if (eh->e_shoff && (size_t)eh->e_shoff + (size_t)eh->e_shnum * sizeof(Elf32_Shdr) <= m->fsize) {
              const Elf32_Shdr *sh = (const Elf32_Shdr *)(m->file + eh->e_shoff);
              for (i = 0; i < eh->e_shnum; i++) if (sh[i].sh_type == SHT_DYNSYM) m->nsym = (int)(sh[i].sh_size / sizeof(Elf32_Sym));
            }
            if (m->nsym <= 0) { L("%s: jumlah simbol tidak diketahui\n", name); return -1; }
            nmods++;
            *out = m;
            L("[load] %s: base=%p span=0x%zx bias=0x%lx simbol=%d rel=%u jmprel=%u init_array=%u\n", name, (void *)m->base, m->span, (unsigned long)m->bias, m->nsym, m->nrel, m->njrel, m->niarr);
            return 0;
          }

          static void *mod_find(const Mod *m, const char *name) {
            int i;
            for (i = 1; i < m->nsym; i++) {
              const Elf32_Sym *s = &m->sym[i];
              if (s->st_shndx != SHN_UNDEF && s->st_name && strcmp(m->str + s->st_name, name) == 0) return (void *)(m->bias + s->st_value);
            }
            return NULL;
          }

          static int fp_suspect(const char *n) {
            static const char *k[] = { "sinh","cosh","tanh","asinh","acosh","atanh","cbrt","hypot","fmin","fmax","copysign","nearbyint","lround","ceilf","exp2","exp2f","expm1","log1p","hypotf","fminf","fmaxf","copysignf","modf","modff","sinhf","coshf","tanhf","cbrtf","remainder","fdim","scalbn","scalbnf","nextafter","trunc","rintf","nearbyintf","strtold","glColor4f","glTranslatef","glScalef","glRotatef","glOrthof","glFrustumf","glLineWidth","glTexParameterf","glTexEnvf","glAlphaFunc","glPointSize","glFogf","glLightf","glMaterialf","glDepthRangef","glPolygonOffset","glSampleCoverage","glNormal3f","glBlendColor","glClipPlanef","glFogfv","glLightfv","glMaterialfv","glTexEnvfv","glTexParameterfv","glLightModelf","glPointParameterf","difftime", NULL };
            int i;
            for (i = 0; k[i]; i++) if (strcmp(k[i], n) == 0) return 1;
            return 0;
          }
          static int cnt_fpwarn;

          static uint32_t resolve(const Mod *self, const Elf32_Sym *s) {
            const char *n = self->str + s->st_name;
            int i;
            void *p;
            if (s->st_shndx != SHN_UNDEF) { cnt_self++; return U32(self->bias + s->st_value); }
            for (i = 0; i < nmods; i++) if (&mods[i] != self && (p = mod_find(&mods[i], n))) { cnt_mod++; return U32(p); }
            for (i = 0; shim[i].name; i++) if (strcmp(shim[i].name, n) == 0) { cnt_shim++; if (nshim_hit < 256) shim_hit[nshim_hit++] = shim[i].name; return U32(shim[i].addr); }
            if ((p = dlsym(RTLD_DEFAULT, n))) { cnt_libc++; if (fp_suspect(n)) { cnt_fpwarn++; L("[FP-ABI] PERINGATAN: %s memakai float/double tapi belum punya pembungkus softfp!\n", n); } return U32(p); }
            if (h_gles && (p = dlsym(h_gles, n))) { cnt_gl++; if (fp_suspect(n)) { cnt_fpwarn++; L("[FP-ABI] PERINGATAN: %s memakai float/double tapi belum punya pembungkus softfp!\n", n); } return U32(p); }
            if (h_egl && (p = dlsym(h_egl, n))) { cnt_gl++; return U32(p); }
            if (ELF32_ST_BIND(s->st_info) == STB_WEAK) { cnt_weak0++; return 0; }
            for (i = 0; i < nunres; i++) if (strcmp(unres_name[i], n) == 0) return U32(tstubs[i]);
            cnt_unres++;
            if (nunres < MAXUNRES) { unres_name[nunres] = n; return U32(tstubs[nunres++]); }
            return U32(tstubs[MAXUNRES - 1]);
          }

          static int relocate(Mod *m) {
            int pass, bad = 0;
            unsigned ntype[64] = {0};
            for (pass = 0; pass < 2; pass++) {
              Elf32_Rel *r = pass ? m->jrel : m->rel;
              uint32_t n = pass ? m->njrel : m->nrel, k;
              for (k = 0; k < n; k++) {
                uint32_t type = ELF32_R_TYPE(r[k].r_info), si = ELF32_R_SYM(r[k].r_info);
                uint32_t *where = (uint32_t *)(m->bias + r[k].r_offset);
                if (type < 64) ntype[type]++;
                switch (type) {
                  case R_ARM_NONE: break;
                  case R_ARM_RELATIVE: *where += U32(m->bias); break;
                  case R_ARM_ABS32: if (si) *where += resolve(m, &m->sym[si]); break;
                  case R_ARM_GLOB_DAT: case R_ARM_JUMP_SLOT: *where = resolve(m, &m->sym[si]); break;
                  default: L("[reloc] %s: tipe tidak didukung %u (offset 0x%x)\n", m->name, type, r[k].r_offset); bad++; break;
                }
              }
            }
            L("[reloc] %s: RELATIVE=%u ABS32=%u GLOB_DAT=%u JUMP_SLOT=%u tak-didukung=%d\n", m->name, ntype[R_ARM_RELATIVE], ntype[R_ARM_ABS32], ntype[R_ARM_GLOB_DAT], ntype[R_ARM_JUMP_SLOT], bad);
            return bad;
          }

          static void protect(Mod *m) {
            const Elf32_Ehdr *eh = (const Elf32_Ehdr *)m->file;
            const Elf32_Phdr *ph = (const Elf32_Phdr *)(m->file + eh->e_phoff);
            size_t np = m->span / PAGE, p;
            unsigned char *fl = calloc(np, 1);
            int i;
            __builtin___clear_cache((char *)m->base, (char *)m->base + m->span);
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              uintptr_t a = (m->bias + ph[i].p_vaddr) & ~(uintptr_t)(PAGE - 1);
              uintptr_t e = (m->bias + ph[i].p_vaddr + ph[i].p_memsz + PAGE - 1) & ~(uintptr_t)(PAGE - 1);
              unsigned pr = ((ph[i].p_flags & PF_R) ? PROT_READ : 0) | ((ph[i].p_flags & PF_W) ? PROT_WRITE : 0) | ((ph[i].p_flags & PF_X) ? PROT_EXEC : 0);
              for (; a < e; a += PAGE) fl[(a - (uintptr_t)m->base) / PAGE] |= (unsigned char)pr;
            }
            for (p = 0; p < np; ) {
              size_t q = p + 1;
              while (q < np && fl[q] == fl[p]) q++;
              if (fl[p] && mprotect(m->base + p * PAGE, (q - p) * PAGE, fl[p]) != 0) L("[protect] %s: mprotect gagal: %s\n", m->name, strerror(errno));
              p = q;
            }
            free(fl);
          }

          static void run_init(Mod *m) {
            uint32_t i;
            if (m->init) { L("[init] %s: DT_INIT di 0x%x\n", m->name, m->init); ((void (*)(void))(m->bias + m->init))(); }
            for (i = 0; i < m->niarr; i++) {
              uint32_t f = m->iarr[i];
              if (f == 0 || f == 0xFFFFFFFFu) continue;
              L("[init] %s: init_array[%u] = %p\n", m->name, i, (void *)(uintptr_t)f);
              ((void (*)(void))(uintptr_t)f)();
            }
            L("[init] %s: selesai\n", m->name);
          }

          /* ======================= SDL2 (dlopen) + konteks GLES1 ======================= */
          static void *sdl_h, *g_win, *g_ctx;
          static int (*p_SDL_Init)(uint32_t);
          static const char *(*p_SDL_GetError)(void);
          static int (*p_SDL_GL_SetAttribute)(int, int);
          static void *(*p_SDL_CreateWindow)(const char *, int, int, int, int, uint32_t);
          static void *(*p_SDL_GL_CreateContext)(void *);
          static void (*p_SDL_GL_SwapWindow)(void *);
          static void (*p_SDL_GL_GetDrawableSize)(void *, int *, int *);
          static int (*p_SDL_GL_SetSwapInterval)(int);
          static int (*p_SDL_PollEvent)(void *);
          static const char *(*p_SDL_GetCurrentVideoDriver)(void);
          static const unsigned char *(*p_glGetString)(unsigned);
          static unsigned (*p_glGetError)(void);

          static int gl_init(int *w, int *h) {
            static const char *libs[] = { "libSDL2-2.0.so.0", "/usr/lib32/libSDL2-2.0.so.0", "libSDL2.so", NULL };
            int i, ww = 0, hh = 0;
            for (i = 0; libs[i] && !sdl_h; i++) {
              sdl_h = dlopen(libs[i], RTLD_NOW | RTLD_GLOBAL);
              L("[sdl] dlopen %s : %s\n", libs[i], sdl_h ? "OK" : dlerror());
            }
            if (!sdl_h) return -1;
          #define SYM(n) do { *(void **)&p_##n = dlsym(sdl_h, #n); if (!p_##n) { L("[sdl] simbol %s tidak ada\n", #n); return -1; } } while (0)
            SYM(SDL_Init); SYM(SDL_GetError); SYM(SDL_GL_SetAttribute); SYM(SDL_CreateWindow); SYM(SDL_GL_CreateContext);
            SYM(SDL_GL_SwapWindow); SYM(SDL_GL_GetDrawableSize); SYM(SDL_GL_SetSwapInterval); SYM(SDL_PollEvent);
            SYM(SDL_GetCurrentVideoDriver);
          #undef SYM
            if (p_SDL_Init(0x00000020u) != 0) { L("[sdl] SDL_Init(VIDEO) gagal: %s\n", p_SDL_GetError()); return -1; }
            L("[sdl] video driver: %s\n", p_SDL_GetCurrentVideoDriver() ? p_SDL_GetCurrentVideoDriver() : "?");
            p_SDL_GL_SetAttribute(17, 1);  /* CONTEXT_MAJOR_VERSION */
            p_SDL_GL_SetAttribute(18, 1);  /* CONTEXT_MINOR_VERSION */
            p_SDL_GL_SetAttribute(21, 4);  /* PROFILE_MASK = ES */
            p_SDL_GL_SetAttribute(0, 8); p_SDL_GL_SetAttribute(1, 8); p_SDL_GL_SetAttribute(2, 8); p_SDL_GL_SetAttribute(3, 0);
            p_SDL_GL_SetAttribute(5, 1); p_SDL_GL_SetAttribute(6, 16); p_SDL_GL_SetAttribute(7, 8);
            g_win = p_SDL_CreateWindow("Luxor", 0x1FFF0000, 0x1FFF0000, 640, 480, 0x00000002u | 0x00001001u);
            if (!g_win) { L("[sdl] SDL_CreateWindow gagal: %s\n", p_SDL_GetError()); return -1; }
            g_ctx = p_SDL_GL_CreateContext(g_win);
            if (!g_ctx) { L("[sdl] SDL_GL_CreateContext (GLES1) gagal: %s\n", p_SDL_GetError()); return -1; }
            p_SDL_GL_SetSwapInterval(1);
            p_SDL_GL_GetDrawableSize(g_win, &ww, &hh);
            *w = ww > 0 ? ww : 640; *h = hh > 0 ? hh : 480;
            *(void **)&p_glGetString = h_gles ? dlsym(h_gles, "glGetString") : NULL;
            *(void **)&p_glGetError = h_gles ? dlsym(h_gles, "glGetError") : NULL;
            if (p_glGetString) {
              L("[gl] VENDOR   : %s\n", (const char *)p_glGetString(0x1F00));
              L("[gl] RENDERER : %s\n", (const char *)p_glGetString(0x1F01));
              L("[gl] VERSION  : %s\n", (const char *)p_glGetString(0x1F02));
              L("[gl] EXTENSIONS: %.600s\n", (const char *)p_glGetString(0x1F03));
            }
            L("[gl] ukuran drawable: %dx%d\n", *w, *h);
            return 0;
          }

          static void on_alarm(int sig) { (void)sig; L("\n*** WATCHDOG: waktu habis, proses dihentikan ***\n"); _exit(4); }

          /* ======================= uji mandiri ======================= */
          static int st_va(const char *sig, ...) { va_list ap; jv a[16]; int n; va_start(ap, sig); n = collect_va(sig, ap, a); va_end(ap);
            return n == 6 && a[0].i == -5 && a[1].j == 0x123456789aLL && a[2].l == (void *)0x1234 && a[3].i == 7 && a[4].d > 2.49 && a[4].d < 2.51 && a[5].f > 1.49f && a[5].f < 1.51f; }
          static int selftest(void) {
            int ok = 1; uint32_t off = 0, len = 0; int method = -1;
            L("== selftest ==\n");
            if (st_va("(IJLjava/lang/String;ZDF)V", -5, 0x123456789aLL, (void *)0x1234, 7, 2.5, 1.5)) L("  collect_va: LULUS\n"); else { L("  collect_va: GAGAL\n"); ok = 0; }
            if (sig_nargs("(IJ[ILjava/lang/String;[[Ljava/lang/Object;)V") == 5) L("  sig_nargs: LULUS\n"); else { L("  sig_nargs: GAGAL\n"); ok = 0; }
            if ((bionic_ctype[1 + 'A'] & 0x41) == 0x41 && (bionic_ctype[1 + '5'] & 0x44) == 0x44 && (bionic_ctype[1 + ' '] & 0x88) == 0x88 && bionic_tolower[1 + 'Q'] == 'q') L("  ctype/tolower: LULUS\n"); else { L("  ctype/tolower: GAGAL\n"); ok = 0; }
            if (apk_find(g_apk, "assets/data.mjz", &off, &len, &method) == 0) L("  apk_find(assets/data.mjz): offset=%u panjang=%u method=%d\n", off, len, method);
            else L("  apk_find: tidak dicoba/gagal (APK: %s)\n", g_apk);
            L("== selftest %s ==\n", ok ? "SEMUA LULUS" : "ADA YANG GAGAL");
            return ok ? 0 : 1;
          }

          /* ======================= main ======================= */
          typedef void (*boot_fn)(void *, void *, void *, void *, void *, void *);
          typedef void (*init_fn)(void *, void *, int, int);
          typedef void (*frame_fn)(void *, void *);

          int main(int argc, char **argv) {
            const char *dir = "libs";
            int dry = 0, i, stage = 3, frames = 60, timeout = 90, do_selftest = 0;
            Mod *fm = NULL, *mn = NULL;
            struct sigaction sa;
            struct utsname u;
            char cwd[400], apk_abs[1024], files_dir[460], ext_dir[460];

            snprintf(g_apk, sizeof g_apk, "luxor.apk");
            for (i = 1; i < argc; i++) {
              if (!strcmp(argv[i], "--dry")) dry = 1;
              else if (!strcmp(argv[i], "--selftest")) do_selftest = 1;
              else if (!strcmp(argv[i], "--apk") && i + 1 < argc) snprintf(g_apk, sizeof g_apk, "%s", argv[++i]);
              else if (!strcmp(argv[i], "--frames") && i + 1 < argc) frames = atoi(argv[++i]);
              else if (!strcmp(argv[i], "--stage") && i + 1 < argc) stage = atoi(argv[++i]);
              else if (!strcmp(argv[i], "--timeout") && i + 1 < argc) timeout = atoi(argv[++i]);
              else if (argv[i][0] != '-') dir = argv[i];
            }
            g_log = fopen("loader_log.txt", "w");
            L("== luxorloader (Milestone 3) ==\n");
            if (uname(&u) == 0) L("device: %s %s %s | glibc %s\n", u.sysname, u.release, u.machine, gnu_get_libc_version());
          #if !defined(__arm__)
            dry = 1;
            L("(bukan ARM: mode --dry dipaksa)\n");
          #endif
            L("libs: %s | apk: %s | mode: %s | stage=%d frames=%d timeout=%ds\n", dir, g_apk, dry ? "DRY" : "JALAN", stage, frames, timeout);

            memset(&sa, 0, sizeof sa);
            sa.sa_sigaction = on_sig; sa.sa_flags = SA_SIGINFO;
            sigaction(SIGSEGV, &sa, NULL); sigaction(SIGBUS, &sa, NULL); sigaction(SIGILL, &sa, NULL);
            sigaction(SIGFPE, &sa, NULL);  sigaction(SIGABRT, &sa, NULL);
            signal(SIGALRM, on_alarm);

            init_tables();
            init_jni();
            if (do_selftest) return selftest();

            dlopen("libm.so.6", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libgcc_s.so.1", RTLD_NOW | RTLD_GLOBAL);
            dlopen("libstdc++.so.6", RTLD_NOW | RTLD_GLOBAL);
            h_gles = dlopen("/usr/lib32/libGLESv1_CM.so.1", RTLD_LAZY | RTLD_LOCAL);
            h_egl = dlopen("/usr/lib32/libEGL.so.1", RTLD_LAZY | RTLD_LOCAL);
            L("GLESv1_CM: %s | EGL: %s\n", h_gles ? "OK" : "TIDAK ADA", h_egl ? "OK" : "TIDAK ADA");

            if (load_mod(dir, "libfmodex.so", &fm) != 0) return 1;
            if (relocate(fm) != 0) return 1;
            protect(fm);
            if (load_mod(dir, "libmain.so", &mn) != 0) return 1;
            if (relocate(mn) != 0) return 1;
            protect(mn);

            L("\n== ringkasan resolusi simbol ==\n");
            L("modul sendiri=%d | modul lain (fmodex)=%d | shim=%d | glibc/libstdc++=%d | GL/EGL=%d | weak->0=%d | TAK TERSELESAIKAN=%d | peringatan FP-ABI=%d\n",
              cnt_self, cnt_mod, cnt_shim, cnt_libc, cnt_gl, cnt_weak0, cnt_unres, cnt_fpwarn);
            for (i = 0; i < nunres; i++) L("  TAK TERSELESAIKAN: %s\n", unres_name[i]);

            if (dry) { L("\n== DRY selesai (tidak ada kode game yang dijalankan) ==\n"); return 0; }
            if (timeout > 0) alarm((unsigned)timeout);

            L("\n== konstruktor ==\n");
            run_init(fm);
            run_init(mn);

            L("\n== JNI_OnLoad ==\n");
            {
              void *fn = mod_find(mn, "JNI_OnLoad");
              if (!fn) { L("JNI_OnLoad tidak ada\n"); return 1; }
              L("JNI_OnLoad -> 0x%x\n", ((int (*)(void *, void *))fn)((void *)&g_vmobj, NULL));
            }

            {
              boot_fn f_boot = (boot_fn)mod_find(mn, "Java_com_mumbojumbo_mj2_MJ2JNILib_bootstrap");
              init_fn f_init = (init_fn)mod_find(mn, "Java_com_mumbojumbo_mj2_MJ2JNILib_initialize");
              frame_fn f_frame = (frame_fn)mod_find(mn, "Java_com_mumbojumbo_mj2_MJ2JNILib_singleFrame");
              void *env = (void *)&g_envobj, *cls = mk_handle("class", "com/mumbojumbo/mj2/MJ2JNILib");
              void *act = mk_obj("com/mumbojumbo/mj2/MJ2Activity");
              int w = 640, h = 480, f, quit = 0, nerr = 0;

              L("\n== fungsi native ==\nbootstrap=%p initialize=%p singleFrame=%p\n", (void *)f_boot, (void *)f_init, (void *)f_frame);
              if (!f_boot || !f_init || !f_frame) { L("fungsi native tidak lengkap\n"); return 1; }

              if (!getcwd(cwd, sizeof cwd)) snprintf(cwd, sizeof cwd, ".");
              if (!realpath(g_apk, apk_abs)) snprintf(apk_abs, sizeof apk_abs, "%s/%s", cwd, g_apk);
              snprintf(files_dir, sizeof files_dir, "%s/files", cwd); snprintf(ext_dir, sizeof ext_dir, "%s/ext", cwd);
              mkdir(files_dir, 0755); mkdir(ext_dir, 0755);

              L("\n== bootstrap(activity, \"%s\", \"%s\", \"%s\") ==\n", apk_abs, files_dir, ext_dir);
              f_boot(env, cls, act, mk_handle("string", apk_abs), mk_handle("string", files_dir), mk_handle("string", ext_dir));
              L("bootstrap selesai\n");

              if (stage >= 2) {
                L("\n== membuat jendela + konteks GLES1 ==\n");
                if (gl_init(&w, &h) != 0) { L("GL gagal, berhenti.\n"); return 1; }
                L("\n== initialize(%d, %d) ==\n", w, h);
                f_init(env, cls, w, h);
                L("initialize selesai\n");
              }

              if (stage >= 3) {
                L("\n== singleFrame x%d ==\n", frames);
                for (f = 0; f < frames && !quit; f++) {
                  unsigned char ev[64];
                  unsigned err;
                  while (p_SDL_PollEvent(ev)) {
                    uint32_t t; memcpy(&t, ev, 4);
                    if (t == 0x100u) quit = 1;
                    if (t == 0x300u) { int32_t sym; memcpy(&sym, ev + 20, 4); if (sym == 27) quit = 1; }
                  }
                  f_frame(env, cls);
                  p_SDL_GL_SwapWindow(g_win);
                  err = p_glGetError ? p_glGetError() : 0;
                  if (err && nerr < 10) { L("[gl] glGetError=0x%x pada frame %d\n", err, f); nerr++; }
                  if (f < 5 || f % 30 == 0) L("[frame] %d selesai\n", f);
                }
                L("\n== %d frame selesai ==\n", f);
              }

              L("\n== ringkasan panggilan Java (jumlah) ==\n");
              for (i = 0; i < nminfo; i++) if (minfo[i].count) L("  %5u  %s.%s%s\n", minfo[i].count, minfo[i].cls, minfo[i].name, minfo[i].sig);
            }
            L("\n== Milestone 3 selesai ==\n");
            return 0;
          }
          EOF_C2
          cat > src/gen_stubs.py <<'EOF_PY'
          # Menghasilkan stubs.inc: nama slot JNI + 256 stub JNI + 64 stub simbol-tak-terselesaikan
          types = ["Object","Boolean","Byte","Char","Short","Int","Long","Float","Double","Void"]
          prims = ["Boolean","Byte","Char","Short","Int","Long","Float","Double"]
          n = {}
          for i in range(4): n[i] = "reserved%d" % i
          n[4]="GetVersion"; n[5]="DefineClass"; n[6]="FindClass"; n[7]="FromReflectedMethod"; n[8]="FromReflectedField"
          n[9]="ToReflectedMethod"; n[10]="GetSuperclass"; n[11]="IsAssignableFrom"; n[12]="ToReflectedField"
          n[13]="Throw"; n[14]="ThrowNew"; n[15]="ExceptionOccurred"; n[16]="ExceptionDescribe"; n[17]="ExceptionClear"
          n[18]="FatalError"; n[19]="PushLocalFrame"; n[20]="PopLocalFrame"; n[21]="NewGlobalRef"; n[22]="DeleteGlobalRef"
          n[23]="DeleteLocalRef"; n[24]="IsSameObject"; n[25]="NewLocalRef"; n[26]="EnsureLocalCapacity"
          n[27]="AllocObject"; n[28]="NewObject"; n[29]="NewObjectV"; n[30]="NewObjectA"
          n[31]="GetObjectClass"; n[32]="IsInstanceOf"; n[33]="GetMethodID"
          i = 34
          for t in types:
              for s in ("", "V", "A"): n[i] = "Call%sMethod%s" % (t, s); i += 1
          for t in types:
              for s in ("", "V", "A"): n[i] = "CallNonvirtual%sMethod%s" % (t, s); i += 1
          assert i == 94
          n[94]="GetFieldID"; i = 95
          for t in types[:9]: n[i] = "Get%sField" % t; i += 1
          for t in types[:9]: n[i] = "Set%sField" % t; i += 1
          assert i == 113
          n[113]="GetStaticMethodID"; i = 114
          for t in types:
              for s in ("", "V", "A"): n[i] = "CallStatic%sMethod%s" % (t, s); i += 1
          assert i == 144
          n[144]="GetStaticFieldID"; i = 145
          for t in types[:9]: n[i] = "GetStatic%sField" % t; i += 1
          for t in types[:9]: n[i] = "SetStatic%sField" % t; i += 1
          assert i == 163
          for k, nm in enumerate(["NewString","GetStringLength","GetStringChars","ReleaseStringChars","NewStringUTF",
                                  "GetStringUTFLength","GetStringUTFChars","ReleaseStringUTFChars","GetArrayLength",
                                  "NewObjectArray","GetObjectArrayElement","SetObjectArrayElement"]):
              n[163 + k] = nm
          i = 175
          for t in prims: n[i] = "New%sArray" % t; i += 1
          for t in prims: n[i] = "Get%sArrayElements" % t; i += 1
          for t in prims: n[i] = "Release%sArrayElements" % t; i += 1
          for t in prims: n[i] = "Get%sArrayRegion" % t; i += 1
          for t in prims: n[i] = "Set%sArrayRegion" % t; i += 1
          assert i == 215
          for k, nm in enumerate(["RegisterNatives","UnregisterNatives","MonitorEnter","MonitorExit","GetJavaVM",
                                  "GetStringRegion","GetStringUTFRegion","GetPrimitiveArrayCritical",
                                  "ReleasePrimitiveArrayCritical","GetStringCritical","ReleaseStringCritical",
                                  "NewWeakGlobalRef","DeleteWeakGlobalRef","ExceptionCheck","NewDirectByteBuffer",
                                  "GetDirectBufferAddress","GetDirectBufferCapacity","GetObjectRefType"]):
              n[215 + k] = nm
          assert n[215]=="RegisterNatives" and n[228]=="ExceptionCheck" and n[232]=="GetObjectRefType"
          assert n[33]=="GetMethodID" and n[113]=="GetStaticMethodID" and n[169]=="GetStringUTFChars" and n[167]=="NewStringUTF"
          assert n[61]=="CallVoidMethod" and n[141]=="CallStaticVoidMethod" and n[129]=="CallStaticIntMethod"
          o = []
          o.append("static const char *const jni_names[256] = {")
          for k in range(256):
              o.append('  "%s",' % n.get(k, "slot%d" % k))
          o.append("};")
          for k in range(256):
              o.append("static int jstub_%d(void) { return jni_trap(%d); }" % (k, k))
          o.append("static void *const jstubs[256] = {")
          o.append("  " + ", ".join("(void *)jstub_%d" % k for k in range(256)))
          o.append("};")
          for k in range(64):
              o.append("static int tstub_%d(void) { return trap_unres(%d); }" % (k, k))
          o.append("static void *const tstubs[64] = {")
          o.append("  " + ", ".join("(void *)tstub_%d" % k for k in range(64)))
          o.append("};")
          open("stubs.inc", "w").write("\n".join(o) + "\n")
          print("stubs.inc ok, nama terisi:", len(n))
          EOF_PY
          cat > src/launcher.tpl <<'EOF_TPL'
          #!/bin/bash
          # Luxor Android loader (Milestone 3). MODE: @MODE@
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/luxor_android"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/luxor_android"

          cd "$GAMEDIR" || {
            echo "folder luxor_android tidak ketemu: /$directory/ports/luxor_android" > "$(dirname "$0")/loader_error.txt"
            exit 1
          }

          export LD_LIBRARY_PATH="/usr/lib32:/lib32:${LD_LIBRARY_PATH}"
          chmod +x ./luxorloader 2>/dev/null

          if [ ! -f libs/libmain.so ] || [ ! -f libs/libfmodex.so ] || [ ! -f ./luxorloader ]; then
            echo "libs/libmain.so, libs/libfmodex.so atau luxorloader belum ada di $GAMEDIR" > loader_stdout.txt
            sleep 3
            exit 1
          fi

          echo "GAMEDIR=$GAMEDIR  mode=@MODE@" > loader_stdout.txt
          [ -f luxor.apk ] || echo "PERINGATAN: luxor.apk tidak ada di $GAMEDIR (salin APK Luxor dan namai luxor.apk)" >> loader_stdout.txt
          LOADER_ARGS="$(cat loader.args 2>/dev/null)"
          ./luxorloader libs @ARG@ $LOADER_ARGS >> loader_stdout.txt 2>&1
          echo "exit code: $?" >> loader_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_TPL
          cat > out/LuxorProbe.sh <<'EOF_SH'
          #!/bin/bash
          # Probe Luxor Android (Milestone 1). Hanya membaca, tidak mengubah apa pun.
          # Folder data dicari seperti launcher PortMaster lain (mis. Limbo.sh): /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/luxor_android"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/luxor_android"

          cd "$GAMEDIR" || {
            echo "folder luxor_android tidak ketemu. Dicari di: /$directory/ports/luxor_android dan di sebelah script ini." > "$(dirname "$0")/probe_error.txt"
            exit 1
          }

          export LD_LIBRARY_PATH="/usr/lib32:/lib32:${LD_LIBRARY_PATH}"
          chmod +x ./elfprobe 2>/dev/null

          echo "GAMEDIR=$GAMEDIR" > probe_stdout.txt
          if [ ! -f libs/libmain.so ] || [ ! -f libs/libfmodex.so ]; then
            echo "libs/libmain.so dan libs/libfmodex.so belum ada di $GAMEDIR/libs" > probe_report.txt
            sleep 3
            exit 1
          fi

          ./elfprobe libs/libmain.so libs/libfmodex.so probe_report.txt >> probe_stdout.txt 2>&1
          echo "exit code: $?" >> probe_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH
          echo "--apk luxor.apk --stage 3 --frames 120 --timeout 90" > out/luxor_android/loader.args
          echo "Taruh libmain.so dan libfmodex.so (dari lib/armeabi-v7a di APK) di folder ini. Jangan di-upload ke GitHub." > out/luxor_android/libs/TARUH-LIB-DI-SINI.txt

      - name: Buat stub JNI dan skrip peluncur
        run: |
          cd src && python3 gen_stubs.py && cd ..
          sed -e 's/@MODE@/JALAN/' -e 's/@ARG@//' src/launcher.tpl > out/LuxorLoader.sh
          sed -e 's/@MODE@/DRY/' -e 's/@ARG@/--dry/' src/launcher.tpl > out/LuxorLoader_dry.sh
          bash -n out/LuxorLoader.sh
          bash -n out/LuxorLoader_dry.sh

      - name: Kompilasi (armhf)
        run: |
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -Wno-missing-field-initializers -o out/luxor_android/elfprobe src/elfprobe.c -ldl
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -Wno-missing-field-initializers -Isrc -o out/luxor_android/luxorloader src/luxorloader.c -ldl -lpthread -lm
          file out/luxor_android/luxorloader || true
          echo "--- library yang dibutuhkan:"
          arm-linux-gnueabihf-readelf -d out/luxor_android/luxorloader | grep NEEDED
          echo "--- versi GLIBC tertinggi yang dibutuhkan:"
          arm-linux-gnueabihf-readelf -V out/luxor_android/luxorloader | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: luxor-probe-armhf
          path: out
